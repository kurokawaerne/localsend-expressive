name: build

on:
  push:
    branches: [main, v0.5.0]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust core tests
        working-directory: core-rust
        run: cargo test
      - name: Rust core JNI build check
        working-directory: core-rust
        run: cargo build --release --features jni

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Protocol tests (desktop)
        run: ./gradlew :shared:desktopTest
      - name: Compile desktop app
        run: ./gradlew :desktopApp:compileKotlin
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug
