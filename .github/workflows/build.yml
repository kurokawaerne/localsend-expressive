name: build

on:
  push:
    branches: [main, v0.6.0]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        working-directory: core-rust
        run: cargo test
      - name: Test and compile shared + desktop
        run: ./gradlew :shared:desktopTest :shared:compileKotlinDesktop
      - name: Assemble Android release (unsigned in CI)
        run: ./gradlew :androidApp:assembleRelease
