name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test, build APK and Linux packages
        run: ./gradlew :shared:desktopTest :androidApp:assembleDebug :desktopApp:packageDeb :desktopApp:createDistributable
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release-assets/localsend-expressive-0.1.0-android.apk
          DEB=$(find desktopApp/build/compose/binaries -name "*.deb" | head -1)
          cp "$DEB" release-assets/localsend-expressive-0.1.0-linux.deb
          cd desktopApp/build/compose/binaries/main/app
          zip -qr "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.1.0-linux-portable.zip" localsend-expressive
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocalSend Expressive ${{ inputs.tag }}
          prerelease: true
          body: |
            First build of the Compose Multiplatform rewrite (M0 scaffold).

            - **Android**: debug-signed APK, installs alongside official LocalSend (package dev.kurokawa.localsend.expressive).
            - **Linux portable**: unzip and run `localsend-expressive/bin/localsend-expressive` — works on Arch.
            - **Linux .deb**: for Debian/Ubuntu-based systems.

            Discovery/transfer land in M1/M2 — this build is the UI shell + protocol foundation.
          files: release-assets/*
