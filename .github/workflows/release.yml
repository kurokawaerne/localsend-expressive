name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v0.9.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        run: echo "${{ secrets.LSEX_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lsex.keystore"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Test Rust core
        working-directory: core-rust
        run: cargo test
      - name: Build Rust core natives
        continue-on-error: true
        run: |
          set -e
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cd core-rust
          cargo build --release --features jni --target aarch64-linux-android
          cargo build --release --features jni --target armv7-linux-androideabi
          cargo build --release --features jni --target x86_64-linux-android
          cargo build --release --features jni
          cd ..
          mkdir -p androidApp/src/main/jniLibs/arm64-v8a androidApp/src/main/jniLibs/armeabi-v7a androidApp/src/main/jniLibs/x86_64 desktopApp/src/main/resources/native
          cp core-rust/target/aarch64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/arm64-v8a/
          cp core-rust/target/armv7-linux-androideabi/release/liblsex_core.so androidApp/src/main/jniLibs/armeabi-v7a/
          cp core-rust/target/x86_64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/x86_64/
          cp core-rust/target/release/liblsex_core.so desktopApp/src/main/resources/native/
          ls -lh androidApp/src/main/jniLibs/*/liblsex_core.so desktopApp/src/main/resources/native/
      - name: Test and build APK + desktop distributable
        env:
          LSEX_KEYSTORE_FILE: ${{ runner.temp }}/lsex.keystore
          LSEX_STORE_PASSWORD: ${{ secrets.LSEX_STORE_PASSWORD }}
          LSEX_KEY_PASSWORD: ${{ secrets.LSEX_KEY_PASSWORD }}
          LSEX_KEY_ALIAS: lsex
        run: ./gradlew :shared:desktopTest :androidApp:assembleRelease :desktopApp:createDistributable
      - name: Slim the desktop image (v0.9.0 size pass)
        run: |
          set -e
          APP=desktopApp/build/compose/binaries/main/app/localsend-expressive
          # Rebuild the runtime with a compressed jimage: same Temurin
          # 21, same module set the Compose plugin ships (verified
          # against the v0.8.0 image). Locally verified end to end:
          # the slimmed image boots and enters composition.
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.datatransfer,java.xml,java.prefs,java.desktop,java.logging,jdk.crypto.ec --output "$RUNNER_TEMP/slim-runtime" --compress=2 --strip-debug --no-header-files --no-man-pages
          rm -rf "$APP/lib/runtime"
          mv "$RUNNER_TEMP/slim-runtime" "$APP/lib/runtime"
          # Strip native libraries (symbol tables are dead weight).
          find "$APP" -name '*.so' -exec strip --strip-unneeded {} +
          # Prune the ~3,800 unused Material Symbols icons per jar (the
          # app uses ~140; keep-set derived from the sources and
          # verified by a full class-load audit of the pruned jars).
          python3 scripts/prune_icons.py "$GITHUB_WORKSPACE" "$APP"/lib/app/icons-material-symbols-outlined-cmp-jvm-*.jar com/composables/icons/materialsymbols/outlined/
          python3 scripts/prune_icons.py "$GITHUB_WORKSPACE" "$APP"/lib/app/icons-material-symbols-outlined-filled-cmp-jvm-*.jar com/composables/icons/materialsymbols/outlinedfilled/
          du -sh "$APP"
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Split APKs per ABI + universal (v0.5.0): pick the smallest one
          # your device needs — arm64-v8a covers almost every modern phone.
          ls androidApp/build/outputs/apk/release/
          cp androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk release-assets/localsend-expressive-0.9.0-android-arm64-v8a.apk
          cp androidApp/build/outputs/apk/release/androidApp-armeabi-v7a-release.apk release-assets/localsend-expressive-0.9.0-android-armeabi-v7a.apk
          cp androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk release-assets/localsend-expressive-0.9.0-android-x86_64.apk
          cp androidApp/build/outputs/apk/release/androidApp-universal-release.apk release-assets/localsend-expressive-0.9.0-android.apk
          cd desktopApp/build/compose/binaries/main/app
          zip -9 -qr "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.9.0-linux-portable.zip" localsend-expressive
          cd "$GITHUB_WORKSPACE"
          ls -lh release-assets
      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          set -e
          APP_DIR=desktopApp/build/compose/binaries/main/app/localsend-expressive
          PKGDIR="$PWD/pkgdir"
          mkdir -p "$PKGDIR/opt" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp -r "$APP_DIR" "$PKGDIR/opt/localsend-expressive"
          ln -s /opt/localsend-expressive/bin/localsend-expressive "$PKGDIR/usr/bin/localsend-expressive"
          cat > "$PKGDIR/usr/share/applications/localsend-expressive.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LocalSend Expressive
          Comment=Share files locally - Material 3 Expressive edition
          Exec=localsend-expressive
          Icon=localsend-expressive
          Categories=Network;FileTransfer;
          Terminal=false
          DESKTOP
          SIZE=$(du -sb "$PKGDIR" | cut -f1)
          cat > "$PKGDIR/.PKGINFO" <<PKGINFO
          pkgname = localsend-expressive
          pkgbase = localsend-expressive
          pkgver = 0.9.0-1
          pkgdesc = Material 3 Expressive rewrite of LocalSend (Compose Multiplatform) for Android and Linux
          url = https://github.com/kurokawaerne/localsend-expressive
          builddate = $(date +%s)
          packager = kurokawaerne
          size = $SIZE
          arch = x86_64
          license = Apache
          depend = glibc
          PKGINFO
          cd "$PKGDIR"
          tar --zstd -cf "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.9.0-1-x86_64.pkg.tar.zst" .PKGINFO opt usr
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocalSend Expressive ${{ inputs.tag }}
          prerelease: true
          files: release-assets/*
          body: |
            The verdict release: every point of Ernest's v0.8.0 on-device review, in one batch.

            **Design, redone with the real components**
            - The nav bar is now the native Material 3 Expressive **ShortNavigationBar** — no more dark box behind the items, only the slim indicator pill behind the selected icon, theme colors throughout. The floating transfer pill is exactly the nav bar's width.
            - Home's connection control and Quick Save use **connected ToggleButton groups** (the segmented buttons are deprecated); Send uses the official **split button**; Settings is a faithful Minus copy — segmented tiles, icon circles, whole-row switches, pickers instead of dropdowns (language as a list).
            - **Minus's themes, copied whole**: all 17 of Minus's color schemes (Pink, Red, Blue, Orange, Yellow, Aqua, Cyan, Purple, Green — each in a vivid and a neutral variant) join the LSEx brand theme and Monochrome, presented exactly the way Minus presents them — a System/Light/Dark connected group, then a "Color scheme" row of 54dp swatches that morph circle → clover when selected, plus a separate **Material You** toggle (wallpaper colors apply to the brand theme, as in Minus).
            - The device card now shows the **transfer progress behind it** while sending or receiving, the wordmark matches the mockup, and History rows got their missing swipe actions.
            - Headings that vanished on dark/monochrome themes are fixed at the root (the scaffold now provides a proper content color), and there is a new hand-built **Monochrome** color style with guaranteed contrast.
            - **Splash**: dynamic colors, the "LocalSend Expressive" wordmark, and the arrows sweep in from the top and bottom corners in an almost-circular motion and bounce when they meet — on Android too, once per cold start, and hardened so it can never trap you.

            **Fixed functions**
            - **Sender progress is live now**: whole-file sends update the transfer sheet and the device card as bytes move, not just at the end.
            - **The web share page loads in browsers**: the self-signed certificate now carries proper SANs (old certs are regenerated once — favorites need re-adding, sorry) and is no longer marked as a CA, which is what made Chrome reject it.
            - **Wi-Fi Direct** creation is retried in stages with zombie-group cleanup and a fresh channel, and it applies your group name/password/band; the WiFi panel lists nearby networks with connect buttons. One honest note on the **hotspot**: Android reserves hotspot credentials to system apps, so on Android the system assigns the hotspot's name and password (the app shows the ones that took effect, with the join QR) — custom hotspot settings apply on the Linux desktop build, where the platform allows them.
            - Downloads land in the **public Downloads folder** by default, tapping a busy device reliably opens its transfers, and scrolling stays smooth during transfers (progress updates no longer recompose the whole screen; desktop thumbnails are downsampled and cached).

            **More**
            - Settings: edit your **name, device model and device type** right in the profile section, next to the avatar; **Donate** section with crypto wallets (Litecoin preferred, QR included).
            - **58 languages** for the app chrome — every language the official LocalSend ships.
            - The PC downloads are ~15% smaller (compressed runtime image, stripped natives, unused icons pruned) — verified by booting the slimmed image.
