name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v0.8.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        run: echo "${{ secrets.LSEX_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lsex.keystore"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Test Rust core
        working-directory: core-rust
        run: cargo test
      - name: Build Rust core natives
        continue-on-error: true
        run: |
          set -e
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cd core-rust
          cargo build --release --features jni --target aarch64-linux-android
          cargo build --release --features jni --target armv7-linux-androideabi
          cargo build --release --features jni --target x86_64-linux-android
          cargo build --release --features jni
          cd ..
          mkdir -p androidApp/src/main/jniLibs/arm64-v8a androidApp/src/main/jniLibs/armeabi-v7a androidApp/src/main/jniLibs/x86_64 desktopApp/src/main/resources/native
          cp core-rust/target/aarch64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/arm64-v8a/
          cp core-rust/target/armv7-linux-androideabi/release/liblsex_core.so androidApp/src/main/jniLibs/armeabi-v7a/
          cp core-rust/target/x86_64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/x86_64/
          cp core-rust/target/release/liblsex_core.so desktopApp/src/main/resources/native/
          ls -lh androidApp/src/main/jniLibs/*/liblsex_core.so desktopApp/src/main/resources/native/
      - name: Test and build APK + desktop distributable
        env:
          LSEX_KEYSTORE_FILE: ${{ runner.temp }}/lsex.keystore
          LSEX_STORE_PASSWORD: ${{ secrets.LSEX_STORE_PASSWORD }}
          LSEX_KEY_PASSWORD: ${{ secrets.LSEX_KEY_PASSWORD }}
          LSEX_KEY_ALIAS: lsex
        run: ./gradlew :shared:desktopTest :androidApp:assembleRelease :desktopApp:createDistributable
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Split APKs per ABI + universal (v0.5.0): pick the smallest one
          # your device needs — arm64-v8a covers almost every modern phone.
          ls androidApp/build/outputs/apk/release/
          cp androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk release-assets/localsend-expressive-0.8.0-android-arm64-v8a.apk
          cp androidApp/build/outputs/apk/release/androidApp-armeabi-v7a-release.apk release-assets/localsend-expressive-0.8.0-android-armeabi-v7a.apk
          cp androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk release-assets/localsend-expressive-0.8.0-android-x86_64.apk
          cp androidApp/build/outputs/apk/release/androidApp-universal-release.apk release-assets/localsend-expressive-0.8.0-android.apk
          cd desktopApp/build/compose/binaries/main/app
          zip -qr "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.8.0-linux-portable.zip" localsend-expressive
          cd "$GITHUB_WORKSPACE"
          ls -lh release-assets
      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          set -e
          APP_DIR=desktopApp/build/compose/binaries/main/app/localsend-expressive
          PKGDIR="$PWD/pkgdir"
          mkdir -p "$PKGDIR/opt" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp -r "$APP_DIR" "$PKGDIR/opt/localsend-expressive"
          ln -s /opt/localsend-expressive/bin/localsend-expressive "$PKGDIR/usr/bin/localsend-expressive"
          cat > "$PKGDIR/usr/share/applications/localsend-expressive.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LocalSend Expressive
          Comment=Share files locally - Material 3 Expressive edition
          Exec=localsend-expressive
          Icon=localsend-expressive
          Categories=Network;FileTransfer;
          Terminal=false
          DESKTOP
          SIZE=$(du -sb "$PKGDIR" | cut -f1)
          cat > "$PKGDIR/.PKGINFO" <<PKGINFO
          pkgname = localsend-expressive
          pkgbase = localsend-expressive
          pkgver = 0.8.0-1
          pkgdesc = Material 3 Expressive rewrite of LocalSend (Compose Multiplatform) for Android and Linux
          url = https://github.com/kurokawaerne/localsend-expressive
          builddate = $(date +%s)
          packager = kurokawaerne
          size = $SIZE
          arch = x86_64
          license = Apache
          depend = glibc
          PKGINFO
          cd "$PKGDIR"
          tar --zstd -cf "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.8.0-1-x86_64.pkg.tar.zst" .PKGINFO opt usr
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocalSend Expressive ${{ inputs.tag }}
          prerelease: true
          files: release-assets/*
          body: |
            The mockup release: rebuilt almost 1:1 from Ernest's own design mockups, on top of the fixes for everything v0.6.0 broke on device. (v0.7.0 was skipped.)

            **Regression fixes (v0.6.0)**
            - **Discovery works again**: the v0.6.0 rewrite dropped the call that starts the networking service, so the app rendered but never announced, listened, or found anyone. Fixed, and the alias you set now applies and refreshes live.
            - **File-select crash fixed**: the staged-file card read a swipe offset before its anchors existed and threw the moment a file was picked.
            - Status bar insets restored (content no longer slides under the clock), dark-on-dark text fixed, folder rows no longer show "-1 items", Quick Save labels no longer wrap mid-word.

            **New design (from the mockups)**
            - **Home**: your device card (avatar, port / HTTPS / protocol chips), connection setup in one segmented control — WiFi / Hotspot / WiFi Direct — and a collapsible History with circular swipe actions and resume for failed sends.
            - **Share**: nearby devices as cards — tap selects by color AND shape change (no checkmarks); the Send split button adds send-via-link and send-to-multiple-devices; the 3x2 picker grid and a collapsible selection card; a "files need attention" warning jumps you to the first damaged file.
            - **Global transfer pill**: while anything is sending or receiving, a pill floats above the nav on EVERY page (combined view when both run); tapping it opens the transfer sheet with per-file rows, wavy progress, and the Transfer / files / speed / ETA bar. Pause and resume any send; the receive queue can be reordered (default: smallest files first, changeable in Settings).
            - **Via link, for real**: Receive via link opens the port and shows a QR page; the web page is a full LocalSend-style page — visitors can send to you (through the normal approval flow) and download what you share. Share via link preloads your selection.
            - **Connection settings**: hotspot and Wi-Fi Direct get real settings (gear on Home, and Settings > Connection): SSID, password or open, band, connected devices. Wi-Fi Direct group creation is fixed and honors them; the radio tiles now reflect the real Wi-Fi state.
            - **Settings** copies Minus's settings style, carries every original LocalSend setting (Quick Save favorites/all/off included), and adds avatar changing (default: platform icons).
            - **New icon + splash**: the comparison-arrows glyph from the mockup is now the app icon; the splash animates the arrows flying in from the corners into the mark.
            - Send and receive run simultaneously; chunked LSEx-to-LSEx transfers stay optional in Settings. The FAB fan and the separate Connect tab are gone — connection setup lives on Home.
