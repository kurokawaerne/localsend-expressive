name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v0.6.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        run: echo "${{ secrets.LSEX_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lsex.keystore"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Test Rust core
        working-directory: core-rust
        run: cargo test
      - name: Build Rust core natives
        continue-on-error: true
        run: |
          set -e
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cd core-rust
          cargo build --release --features jni --target aarch64-linux-android
          cargo build --release --features jni --target armv7-linux-androideabi
          cargo build --release --features jni --target x86_64-linux-android
          cargo build --release --features jni
          cd ..
          mkdir -p androidApp/src/main/jniLibs/arm64-v8a androidApp/src/main/jniLibs/armeabi-v7a androidApp/src/main/jniLibs/x86_64 desktopApp/src/main/resources/native
          cp core-rust/target/aarch64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/arm64-v8a/
          cp core-rust/target/armv7-linux-androideabi/release/liblsex_core.so androidApp/src/main/jniLibs/armeabi-v7a/
          cp core-rust/target/x86_64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/x86_64/
          cp core-rust/target/release/liblsex_core.so desktopApp/src/main/resources/native/
          ls -lh androidApp/src/main/jniLibs/*/liblsex_core.so desktopApp/src/main/resources/native/
      - name: Test and build APK + desktop distributable
        env:
          LSEX_KEYSTORE_FILE: ${{ runner.temp }}/lsex.keystore
          LSEX_STORE_PASSWORD: ${{ secrets.LSEX_STORE_PASSWORD }}
          LSEX_KEY_PASSWORD: ${{ secrets.LSEX_KEY_PASSWORD }}
          LSEX_KEY_ALIAS: lsex
        run: ./gradlew :shared:desktopTest :androidApp:assembleRelease :desktopApp:createDistributable
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Split APKs per ABI + universal (v0.5.0): pick the smallest one
          # your device needs — arm64-v8a covers almost every modern phone.
          ls androidApp/build/outputs/apk/release/
          cp androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk release-assets/localsend-expressive-0.6.0-android-arm64-v8a.apk
          cp androidApp/build/outputs/apk/release/androidApp-armeabi-v7a-release.apk release-assets/localsend-expressive-0.6.0-android-armeabi-v7a.apk
          cp androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk release-assets/localsend-expressive-0.6.0-android-x86_64.apk
          cp androidApp/build/outputs/apk/release/androidApp-universal-release.apk release-assets/localsend-expressive-0.6.0-android.apk
          cd desktopApp/build/compose/binaries/main/app
          zip -qr "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.6.0-linux-portable.zip" localsend-expressive
          cd "$GITHUB_WORKSPACE"
          ls -lh release-assets
      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          set -e
          APP_DIR=desktopApp/build/compose/binaries/main/app/localsend-expressive
          PKGDIR="$PWD/pkgdir"
          mkdir -p "$PKGDIR/opt" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp -r "$APP_DIR" "$PKGDIR/opt/localsend-expressive"
          ln -s /opt/localsend-expressive/bin/localsend-expressive "$PKGDIR/usr/bin/localsend-expressive"
          cat > "$PKGDIR/usr/share/applications/localsend-expressive.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LocalSend Expressive
          Comment=Share files locally - Material 3 Expressive edition
          Exec=localsend-expressive
          Icon=localsend-expressive
          Categories=Network;FileTransfer;
          Terminal=false
          DESKTOP
          SIZE=$(du -sb "$PKGDIR" | cut -f1)
          cat > "$PKGDIR/.PKGINFO" <<PKGINFO
          pkgname = localsend-expressive
          pkgbase = localsend-expressive
          pkgver = 0.6.0-1
          pkgdesc = Material 3 Expressive rewrite of LocalSend (Compose Multiplatform) for Android and Linux
          url = https://github.com/kurokawaerne/localsend-expressive
          builddate = $(date +%s)
          packager = kurokawaerne
          size = $SIZE
          arch = x86_64
          license = Apache
          depend = glibc
          PKGINFO
          cd "$PKGDIR"
          tar --zstd -cf "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.6.0-1-x86_64.pkg.tar.zst" .PKGINFO opt usr
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocalSend Expressive ${{ inputs.tag }}
          prerelease: true
          body: |
            The design release: built from Ernest's v0.5.0 report and a proper study of the Material 3 Expressive kit (Google docs + the Figma Material 3 design kit) and Zapya's layout.

            - **Real tabbed content browsers**: the tabs now SHOW your content — Apps (icons, sizes, in-place checkboxes, search, hide-system toggle), Photos and Videos as thumbnail grids from the media library, Audio as a list, and a Files tab that is a real file browser: storage roots, breadcrumb path bar, folder rows with item counts, file rows with size and date, folders stageable whole. Selection persists across tabs, so one send can mix apps, photos and files. The system picker remains as a fallback inside Files.
            - **One splash, no stall**: the double splash is gone (Android shows the system splash only, held until the first frame; desktop keeps the animated one). Edge-to-edge is on.
            - **Signed release builds**: the APKs are properly release-signed and not debuggable — the Android 16 KB compatibility dialog that listed our Rust library was an artifact of debug builds (we verified the shipped v0.5.0 library was already 16 KB aligned).
            - **Swipe-to-reveal on staged files** (Android): Edit and Discard hide behind a left swipe, per the official list guidance (primary action at the end, long-press as the second path). Desktop keeps visible buttons.
            - **Connect view**: a dedicated connection screen — Create group / Join group cards, a radar with discovered devices as tappable bubbles plus a reliable list, and the radios (Wi-Fi, hotspot, Wi-Fi Direct). The group QR appears ONLY while your own group is up, because it carries the credentials; your connect QR is behind an explicit Show-my-QR tap. The floating nav gains a FAB-menu "fan" for connection setup, and the radar can select a device and jump straight to picking content.
            - **MD3E, for real this time**: official components mapped per part — connected ToggleButton group for Quick Save, FAB menu, LoadingIndicator, wavy progress, primary tabs (scrollable, labels no longer wrap letter-by-letter), segmented lists in Settings (2dp gaps, 20dp outer corners, no dividers) with Android-style vivid icon tones (saturated circle, darker glyph of the same hue). The floating pill nav is the one deliberate custom piece — MD3E has no floating nav bar — built to the pill recipe and truly floating over edge-to-edge content (no black strip).
            - Permissions added for the browsers: media library access, and All files access for the Files tab (both requested in context, with a system-picker fallback).
