# Release workflow — v0.11.0.
# Packaging (Ernest, 2026-11-13): the Linux packages NO LONGER bundle
# a JVM — lib/runtime is removed, the jpackage ELF launcher is
# replaced by a system-Java launcher script, and the Arch package
# declares java-runtime>=21 as a dependency. The same slim step removes
# the now-dead libapplauncher.so. Fonts ship as static instances in
# the repo (no build-time instancing since v0.10.0).

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v0.11.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        run: echo "${{ secrets.LSEX_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lsex.keystore"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Test Rust core
        working-directory: core-rust
        run: cargo test
      - name: Build Rust core natives
        continue-on-error: true
        run: |
          set -e
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cd core-rust
          cargo build --release --features jni --target aarch64-linux-android
          cargo build --release --features jni --target armv7-linux-androideabi
          cargo build --release --features jni --target x86_64-linux-android
          cargo build --release --features jni
          cd ..
          mkdir -p androidApp/src/main/jniLibs/arm64-v8a androidApp/src/main/jniLibs/armeabi-v7a androidApp/src/main/jniLibs/x86_64 desktopApp/src/main/resources/native
          cp core-rust/target/aarch64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/arm64-v8a/
          cp core-rust/target/armv7-linux-androideabi/release/liblsex_core.so androidApp/src/main/jniLibs/armeabi-v7a/
          cp core-rust/target/x86_64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/x86_64/
          cp core-rust/target/release/liblsex_core.so desktopApp/src/main/resources/native/
          ls -lh androidApp/src/main/jniLibs/*/liblsex_core.so desktopApp/src/main/resources/native/
      - name: Test and build APK + desktop distributable
        env:
          LSEX_KEYSTORE_FILE: ${{ runner.temp }}/lsex.keystore
          LSEX_STORE_PASSWORD: ${{ secrets.LSEX_STORE_PASSWORD }}
          LSEX_KEY_PASSWORD: ${{ secrets.LSEX_KEY_PASSWORD }}
          LSEX_KEY_ALIAS: lsex
        run: ./gradlew :shared:desktopTest :androidApp:assembleRelease :desktopApp:createDistributable
      - name: Slim the desktop image + drop the bundled JVM
        run: |
          set -e
          APP=desktopApp/build/compose/binaries/main/app/localsend-expressive
          # No bundled JVM (Ernest, 2026-11-13): the packages ship
          # without lib/runtime and run on a separately installed
          # Java 21+ — the Arch package declares java-runtime>=21.
          rm -rf "$APP/lib/runtime"
          # The jpackage ELF launcher hard-requires the bundled
          # runtime, so replace it with a script that runs the app
          # on the system Java 21. The app's .cfg carries no java
          # options — just the jar classpath and the main class —
          # and the v0.9.0 slimmed image was verified booting with
          # exactly this invocation on a plain JRE.
          cat > "$APP/bin/localsend-expressive" <<'LAUNCHER'
          #!/bin/sh
          # LocalSend Expressive — runs on a separately installed Java 21.
          # Resolve symlinks before locating the app dir (v0.12.0): the
          # Arch package invokes this script through a /usr/bin symlink,
          # and taking $0 at face value put APPDIR at /usr — the jars
          # were never found and the JVM died with
          # ClassNotFoundException: dev.kurokawa.localsend.expressive.MainKt.
          SELF=$(readlink -f -- "$0" 2>/dev/null || printf '%s' "$0")
          APPDIR=$(CDPATH= cd -- "$(dirname -- "$SELF")/.." && pwd)
          if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
            JAVA="$JAVA_HOME/bin/java"
          else
            JAVA=$(command -v java || true)
          fi
          if [ -z "$JAVA" ]; then
            echo "LocalSend Expressive needs Java 21 or newer installed (Arch: sudo pacman -S jre-openjdk)." >&2
            exit 1
          fi
          VERSION=$("$JAVA" -version 2>&1 | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ -z "$VERSION" ]; then VERSION=$("$JAVA" --version 2>/dev/null | awk '{print $2}' | cut -d. -f1); fi
          if [ -z "$VERSION" ] || [ "$VERSION" -lt 21 ]; then
            echo "LocalSend Expressive needs Java 21 or newer." >&2
            exit 1
          fi
          exec "$JAVA" -cp "$APPDIR/lib/app/*" dev.kurokawa.localsend.expressive.MainKt "$@"
          LAUNCHER
          chmod +x "$APP/bin/localsend-expressive"
          # libapplauncher.so only served the replaced ELF launcher.
          rm -f "$APP/lib/libapplauncher.so"
          # Strip native libraries (symbol tables are dead weight).
          find "$APP" -name '*.so' -exec strip --strip-unneeded {} +
          # Prune the ~3,800 unused Material Symbols icons per jar (the
          # app uses ~140; keep-set derived from the sources and
          # verified by a full class-load audit of the pruned jars).
          python3 scripts/prune_icons.py "$GITHUB_WORKSPACE" "$APP"/lib/app/icons-material-symbols-outlined-cmp-jvm-*.jar com/composables/icons/materialsymbols/outlined/
          python3 scripts/prune_icons.py "$GITHUB_WORKSPACE" "$APP"/lib/app/icons-material-symbols-outlined-filled-cmp-jvm-*.jar com/composables/icons/materialsymbols/outlinedfilled/
          du -sh "$APP"
      - name: Collect release assets
        run: |
          VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"
          mkdir -p release-assets
          # Split APKs per ABI + universal (v0.5.0): pick the smallest one
          # your device needs — arm64-v8a covers almost every modern phone.
          ls androidApp/build/outputs/apk/release/
          cp androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk release-assets/localsend-expressive-$VERSION-android-arm64-v8a.apk
          cp androidApp/build/outputs/apk/release/androidApp-armeabi-v7a-release.apk release-assets/localsend-expressive-$VERSION-android-armeabi-v7a.apk
          cp androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk release-assets/localsend-expressive-$VERSION-android-x86_64.apk
          cp androidApp/build/outputs/apk/release/androidApp-universal-release.apk release-assets/localsend-expressive-$VERSION-android.apk
          cd desktopApp/build/compose/binaries/main/app
          zip -9 -qr "$GITHUB_WORKSPACE/release-assets/localsend-expressive-$VERSION-linux-portable.zip" localsend-expressive
          cd "$GITHUB_WORKSPACE"
          ls -lh release-assets
      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          set -e
          VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"
          APP_DIR=desktopApp/build/compose/binaries/main/app/localsend-expressive
          PKGDIR="$PWD/pkgdir"
          mkdir -p "$PKGDIR/opt" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp -r "$APP_DIR" "$PKGDIR/opt/localsend-expressive"
          ln -s /opt/localsend-expressive/bin/localsend-expressive "$PKGDIR/usr/bin/localsend-expressive"
          cat > "$PKGDIR/usr/share/applications/localsend-expressive.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LocalSend Expressive
          Comment=Share files locally - Material 3 Expressive edition
          Exec=localsend-expressive
          Icon=localsend-expressive
          Categories=Network;FileTransfer;
          Terminal=false
          DESKTOP
          SIZE=$(du -sb "$PKGDIR" | cut -f1)
          cat > "$PKGDIR/.PKGINFO" <<PKGINFO
          pkgname = localsend-expressive
          pkgbase = localsend-expressive
          pkgver = $VERSION-1
          pkgdesc = Material 3 Expressive rewrite of LocalSend (Compose Multiplatform) for Android and Linux
          url = https://github.com/kurokawaerne/localsend-expressive
          builddate = $(date +%s)
          packager = kurokawaerne
          size = $SIZE
          arch = x86_64
          license = Apache
          depend = java-runtime>=21
          PKGINFO
          cd "$PKGDIR"
          tar --zstd -cf "$GITHUB_WORKSPACE/release-assets/localsend-expressive-$VERSION-1-x86_64.pkg.tar.zst" .PKGINFO opt usr
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocalSend Expressive ${{ inputs.tag }}
          prerelease: true
          files: release-assets/*
          body: |
            The v0.11.0 verdict release: all five points of Ernest's on-device review, in one batch.

            **PC: the launcher finds its jars again**
            - The Arch package calls the app through a /usr/bin symlink, and the launcher located its jars relative to the path it was called by — /usr — so the JVM died with `ClassNotFoundException: MainKt`. The launcher now resolves the symlink first (reproduced and verified locally: through the symlink it failed word-for-word, with the fix the app starts).

            **The Live Update goes away when the transfer ends**
            - The promoted notification only cancelled when no unfinished job AND no receive data existed — but the receive progress was never cleared after a receive finished, so any earlier receive pinned it at 100% with a Pause button forever. It now tracks actual movement (bytes flowing or a paused job), and the finished receive snapshot clears (completed transfers live in History, as before).

            **Web share is the original implementation now**
            - The browser pages and the download API were replaced with the official LocalSend implementation's: its download and upload pages served verbatim, sessions keyed by the browser's IP, an accepted browser can reload the list, the PIN gate answers 401 / 429 after three wrong tries, downloads validate the session + IP and send properly encoded filenames, and a fresh download request pends until you accept it — or instantly, when the share-via-link auto-accept setting is on. Uploads from the browser keep flowing through the normal approval rules.

            **Copy received texts**
            - Text messages are stored in full in History now (only the first 120 characters were kept), and text entries carry a **Copy** action in their swipe buttons; tapping a text row copies it too. Desktop shows the copy button inline.

            **Also in this batch (added during review)**
            - Android: the Wi-Fi network listing is gone from Home — it never populated; the pane is now one full-width Turn on button plus the QR scanner. Desktop keeps its working network list.
            - A received text now pops up with a Copy button, and still lands in History with its full text.
            - Bouncy Material 3 Expressive motion: springy tab switches, the transfer pill's entrance, expanding sections and device-list movement.
            - Navigation is UDYAT's improvised navbar now: the official floating toolbar in portrait (the selected destination is a pill with its filled icon + label; the others are plain labels), stood upright and icon-only in landscape with the selected icon in a circle. The transfer pill matches the bar's width.
            - The splash is the current logo now — the gradient radar mark spins and bounces in over the dynamic theme colors, on Android and desktop alike; the old arrows artwork is retired.

            **Icon, and release hygiene**
            - The launcher glyph shrinks again — 58 of 108 units wide — fully inside the adaptive-icon safe circle, so launcher masks no longer crop the arcs.
            - Release assets are finally named after the actual version (the 0.11.0 assets said 0.10.0); the Arch pkgver follows the tag too.
