name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test and build APK + desktop distributable
        run: ./gradlew :shared:desktopTest :androidApp:assembleDebug :desktopApp:createDistributable
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release-assets/localsend-expressive-0.3.0-android.apk
          cd desktopApp/build/compose/binaries/main/app
          zip -qr "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.3.0-linux-portable.zip" localsend-expressive
          cd "$GITHUB_WORKSPACE"
          ls -lh release-assets
      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          set -e
          APP_DIR=desktopApp/build/compose/binaries/main/app/localsend-expressive
          PKGDIR="$PWD/pkgdir"
          mkdir -p "$PKGDIR/opt" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp -r "$APP_DIR" "$PKGDIR/opt/localsend-expressive"
          ln -s /opt/localsend-expressive/bin/localsend-expressive "$PKGDIR/usr/bin/localsend-expressive"
          cat > "$PKGDIR/usr/share/applications/localsend-expressive.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LocalSend Expressive
          Comment=Share files locally - Material 3 Expressive edition
          Exec=localsend-expressive
          Categories=Network;FileTransfer;
          Terminal=false
          DESKTOP
          SIZE=$(du -sb "$PKGDIR" | cut -f1)
          cat > "$PKGDIR/.PKGINFO" <<PKGINFO
          pkgname = localsend-expressive
          pkgbase = localsend-expressive
          pkgver = 0.3.0-1
          pkgdesc = Material 3 Expressive rewrite of LocalSend (Compose Multiplatform) for Android and Linux
          url = https://github.com/kurokawaerne/localsend-expressive
          builddate = $(date +%s)
          packager = kurokawaerne
          size = $SIZE
          arch = x86_64
          license = Apache
          depend = glibc
          PKGINFO
          cd "$PKGDIR"
          tar --zstd -cf "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.3.0-1-x86_64.pkg.tar.zst" .PKGINFO opt usr
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocalSend Expressive ${{ inputs.tag }}
          prerelease: true
          body: |
            The correctness + design release. Protocol v2.2 done right, verified against the real official LocalSend core (register, text messages, and file transfer all pass end-to-end):

            - **Protocol**: announcements now carry every field the official app requires (missing fields were silently discarded, which broke discovery both ways); sending uses mutual TLS with our own certificate — the official app requires a client cert, which is why sends failed before; device name is generated once and persisted; discovery socket survives port sharing.
            - **Features restored**: send text messages, Quick Save, Quick Save toggles + Auto Finish on the Receive screen, custom destination folder, manual IP (IP or IP:port), Android share-sheet support, per-file accept, PIN with attempt limiting, partial-acceptance handling.
            - **Design**: Material 3 Expressive throughout — MaterialExpressiveTheme with spring motion, Google Sans Flex variable type (wide/rounded display styles), dynamic wallpaper colors on Android, expressive loading indicator, wavy progress, FAB send menu, grouped settings; adaptive launcher icon with themed (monochrome) variant and an animated splash screen.

            - **Android**: debug-signed APK, installs alongside official LocalSend (package dev.kurokawa.localsend.expressive).
            - **Arch Linux**: `sudo pacman -U localsend-expressive-0.3.0-1-x86_64.pkg.tar.zst`, then run `localsend-expressive`.
            - **Linux portable**: unzip and run `localsend-expressive/bin/localsend-expressive`.
          files: release-assets/*
