# Release workflow — v0.10.0.
# Packaging (Ernest, 2026-11-13): the Linux packages NO LONGER bundle
# a JVM — lib/runtime is removed, the jpackage ELF launcher is
# replaced by a system-Java launcher script, and the Arch package
# declares jre21-openjdk as a dependency. The same slim step removes
# the now-dead libapplauncher.so. Fonts ship as static instances in
# the repo (no build-time instancing since v0.10.0).

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v0.10.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        run: echo "${{ secrets.LSEX_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lsex.keystore"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Test Rust core
        working-directory: core-rust
        run: cargo test
      - name: Build Rust core natives
        continue-on-error: true
        run: |
          set -e
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cd core-rust
          cargo build --release --features jni --target aarch64-linux-android
          cargo build --release --features jni --target armv7-linux-androideabi
          cargo build --release --features jni --target x86_64-linux-android
          cargo build --release --features jni
          cd ..
          mkdir -p androidApp/src/main/jniLibs/arm64-v8a androidApp/src/main/jniLibs/armeabi-v7a androidApp/src/main/jniLibs/x86_64 desktopApp/src/main/resources/native
          cp core-rust/target/aarch64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/arm64-v8a/
          cp core-rust/target/armv7-linux-androideabi/release/liblsex_core.so androidApp/src/main/jniLibs/armeabi-v7a/
          cp core-rust/target/x86_64-linux-android/release/liblsex_core.so androidApp/src/main/jniLibs/x86_64/
          cp core-rust/target/release/liblsex_core.so desktopApp/src/main/resources/native/
          ls -lh androidApp/src/main/jniLibs/*/liblsex_core.so desktopApp/src/main/resources/native/
      - name: Test and build APK + desktop distributable
        env:
          LSEX_KEYSTORE_FILE: ${{ runner.temp }}/lsex.keystore
          LSEX_STORE_PASSWORD: ${{ secrets.LSEX_STORE_PASSWORD }}
          LSEX_KEY_PASSWORD: ${{ secrets.LSEX_KEY_PASSWORD }}
          LSEX_KEY_ALIAS: lsex
        run: ./gradlew :shared:desktopTest :androidApp:assembleRelease :desktopApp:createDistributable
      - name: Slim the desktop image + drop the bundled JVM
        run: |
          set -e
          APP=desktopApp/build/compose/binaries/main/app/localsend-expressive
          # No bundled JVM (Ernest, 2026-11-13): the packages ship
          # without lib/runtime and run on a separately installed
          # Java 21 — the Arch package declares jre21-openjdk.
          rm -rf "$APP/lib/runtime"
          # The jpackage ELF launcher hard-requires the bundled
          # runtime, so replace it with a script that runs the app
          # on the system Java 21. The app's .cfg carries no java
          # options — just the jar classpath and the main class —
          # and the v0.9.0 slimmed image was verified booting with
          # exactly this invocation on a plain JRE.
          cat > "$APP/bin/localsend-expressive" <<'LAUNCHER'
          #!/bin/sh
          # LocalSend Expressive — runs on a separately installed Java 21.
          APPDIR=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
            JAVA="$JAVA_HOME/bin/java"
          else
            JAVA=$(command -v java || true)
          fi
          if [ -z "$JAVA" ]; then
            echo "LocalSend Expressive needs Java 21 installed (Arch: sudo pacman -S jre21-openjdk)." >&2
            exit 1
          fi
          VERSION=$("$JAVA" -version 2>&1 | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ -z "$VERSION" ] || [ "$VERSION" -lt 21 ]; then
            echo "LocalSend Expressive needs Java 21 or newer." >&2
            exit 1
          fi
          exec "$JAVA" -cp "$APPDIR/lib/app/*" dev.kurokawa.localsend.expressive.MainKt "$@"
          LAUNCHER
          chmod +x "$APP/bin/localsend-expressive"
          # libapplauncher.so only served the replaced ELF launcher.
          rm -f "$APP/lib/libapplauncher.so"
          # Strip native libraries (symbol tables are dead weight).
          find "$APP" -name '*.so' -exec strip --strip-unneeded {} +
          # Prune the ~3,800 unused Material Symbols icons per jar (the
          # app uses ~140; keep-set derived from the sources and
          # verified by a full class-load audit of the pruned jars).
          python3 scripts/prune_icons.py "$GITHUB_WORKSPACE" "$APP"/lib/app/icons-material-symbols-outlined-cmp-jvm-*.jar com/composables/icons/materialsymbols/outlined/
          python3 scripts/prune_icons.py "$GITHUB_WORKSPACE" "$APP"/lib/app/icons-material-symbols-outlined-filled-cmp-jvm-*.jar com/composables/icons/materialsymbols/outlinedfilled/
          du -sh "$APP"
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Split APKs per ABI + universal (v0.5.0): pick the smallest one
          # your device needs — arm64-v8a covers almost every modern phone.
          ls androidApp/build/outputs/apk/release/
          cp androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk release-assets/localsend-expressive-0.10.0-android-arm64-v8a.apk
          cp androidApp/build/outputs/apk/release/androidApp-armeabi-v7a-release.apk release-assets/localsend-expressive-0.10.0-android-armeabi-v7a.apk
          cp androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk release-assets/localsend-expressive-0.10.0-android-x86_64.apk
          cp androidApp/build/outputs/apk/release/androidApp-universal-release.apk release-assets/localsend-expressive-0.10.0-android.apk
          cd desktopApp/build/compose/binaries/main/app
          zip -9 -qr "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.10.0-linux-portable.zip" localsend-expressive
          cd "$GITHUB_WORKSPACE"
          ls -lh release-assets
      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          set -e
          APP_DIR=desktopApp/build/compose/binaries/main/app/localsend-expressive
          PKGDIR="$PWD/pkgdir"
          mkdir -p "$PKGDIR/opt" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp -r "$APP_DIR" "$PKGDIR/opt/localsend-expressive"
          ln -s /opt/localsend-expressive/bin/localsend-expressive "$PKGDIR/usr/bin/localsend-expressive"
          cat > "$PKGDIR/usr/share/applications/localsend-expressive.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LocalSend Expressive
          Comment=Share files locally - Material 3 Expressive edition
          Exec=localsend-expressive
          Icon=localsend-expressive
          Categories=Network;FileTransfer;
          Terminal=false
          DESKTOP
          SIZE=$(du -sb "$PKGDIR" | cut -f1)
          cat > "$PKGDIR/.PKGINFO" <<PKGINFO
          pkgname = localsend-expressive
          pkgbase = localsend-expressive
          pkgver = 0.10.0-1
          pkgdesc = Material 3 Expressive rewrite of LocalSend (Compose Multiplatform) for Android and Linux
          url = https://github.com/kurokawaerne/localsend-expressive
          builddate = $(date +%s)
          packager = kurokawaerne
          size = $SIZE
          arch = x86_64
          license = Apache
          depend = jre21-openjdk
          PKGINFO
          cd "$PKGDIR"
          tar --zstd -cf "$GITHUB_WORKSPACE/release-assets/localsend-expressive-0.10.0-1-x86_64.pkg.tar.zst" .PKGINFO opt usr
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocalSend Expressive ${{ inputs.tag }}
          prerelease: true
          files: release-assets/*
          body: |
            The v0.9.0 verdict release: every point of Ernest's on-device review, in one batch — plus a new icon and slimmer PC packages.

            **The nav bar is fixed, for real this time**
            - v0.9.0's bar rendered only Home on phones: the Material 3 ShortNavigationBar inflates every item to the bar's minimum width when the bar itself carries a fillMaxWidth, pushing items 2-3 off the bar. The width now lives on a wrapper and the bar gets loose constraints — all three items render, verified in local renders of every page before this release.

            **The official list component, everywhere**
            - All app lists (History, Selection, the file/music/apps browsers, Donate wallets) are rebuilt on Material 3 Expressive's real **SegmentedListItem** (material3 1.11.0-alpha07; the stack moves to Compose Multiplatform 1.11.1). Expandable headers carry the chevron in its pill, and swipe reveals the mockup's circular actions: History gets remove / open-or-resend / delete-file, Selection gets edit / discard, destructive action last in red.

            **Design details from the verdict**
            - **No more double splash**: Android shows the single system splash with dynamic colors; the Compose splash lives on desktop only.
            - **Wordmark done right**: the mockup's cut is Google Sans Flex *Condensed* — the app now ships static font instances (condensed wordmark cut included) instead of the variable font Android rendered at its default instance. Headings and the wordmark finally match the mockups.
            - **New app icon**: the official LocalSend mark (Apache-2.0, credited) with Google-apps-style gradients — every element carries its own slice of one shared green-to-blue ramp, the way Gmail does it.
            - **Progress bars are solid** (the normal MD3E indicator, sitting detached under the device card exactly as mocked); the wavy indicator survives only for the "checking the received file" state, and only when the checksum toggle is on.
            - The **transfer pill** is the nav bar's width and taller; **Donate** is one Settings section opening its own page, with a copy button on every wallet address.
            - **Browse redesigned**: the picker's tabs are now an icon connected-button group (the checked segment expands to show its label), media tiles are all-rounded with long-press previews (an expand button on desktop), and the file and music browsers gained search + sorting. APK entries use the **apk_document** symbol.

            **Functions**
            - **Android activities, properly split**: Main, Share (system share intents) and Transfer are separate activities over one shared engine; transfers post **Android 16 Live Updates** (promoted ongoing notifications with progress and pause/resume), and the app is prepared for Android 17 **bubbles**.
            - **Predictive back** is on (system callback + animated previews/modals).
            - **Wi-Fi Direct** follows VPNHotspot's playbook: check for an existing group first, adopt or clean it, create once, verify the group actually formed. The **Wi-Fi network list** keeps its scan receiver alive and the app now says so when Android's Location toggle is off (which silently empties scan results).
            - **Split APKs / bundles**: received .apks/.xapk/.apkm sets install with device-matched split selection (your ABI, density and language only — InstallerX-style), .aab is recognised and explained, and sending an app now bundles its splits into a proper .apks.

            **PC packages got lighter**
            - The Linux downloads no longer bundle a JVM — they run on a separately installed **Java 21** (the Arch package declares `jre21-openjdk`; the portable uses Java from PATH/JAVA_HOME). Around 60 MB.
